[package]
name = "agentd"
version = "0.3.3"
edition = "2021"
description = "Archive, redact, sync and browse your coding-agent sessions (Claude Code, Codex, pi)"
license = "MIT"
repository = "https://github.com/program247365/agentd"
readme = "README.md"
rust-version = "1.80"

[dependencies]
anyhow = "1.0"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
humantime = "2.1"
regex = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
lto = true
strip = true
