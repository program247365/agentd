<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<title>agentd</title>
<style>
/* light and dark tokens; one hue per agent */
:root {
  --ground: #F5F4F1; --surface: #FFFFFF; --ink: #1A1917; --dim: #74726D; --faint: #BCB9B3;
  --accent: #2B6B4F; --accent-soft: #E4F0EA; --border: #E6E5E1; --input-bg: #EDECE8;
  --glass: rgba(245, 244, 241, 0.82); --hover-bg: rgba(26, 25, 23, 0.045);
  --danger: #B42318; --danger-soft: #FBEAE8; --mark: #FBE7A1;
  --agent-claude: #C2410C; --agent-codex: #0F766E; --agent-pi: #6D28D9;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --text-xs: 0.6875rem; --text-sm: 0.8125rem; --text-base: 0.9375rem; --text-lg: 1.125rem;
}
@media (min-width: 900px) {
  :root { --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121214; --surface: #1C1C1F; --ink: #E6E5E1; --dim: #908E89; --faint: #3E3D3A;
    --accent: #5ACD8A; --accent-soft: #162B1F; --border: #2C2C2F; --input-bg: #222225;
    --glass: rgba(18, 18, 20, 0.82); --hover-bg: rgba(230, 229, 225, 0.055);
    --danger: #F97066; --danger-soft: #2A1614; --mark: #5C4A12;
    --agent-claude: #FB923C; --agent-codex: #2DD4BF; --agent-pi: #A78BFA;
  }
}
:root[data-theme="dark"] {
  --ground: #121214; --surface: #1C1C1F; --ink: #E6E5E1; --dim: #908E89; --faint: #3E3D3A;
  --accent: #5ACD8A; --accent-soft: #162B1F; --border: #2C2C2F; --input-bg: #222225;
  --glass: rgba(18, 18, 20, 0.82); --hover-bg: rgba(230, 229, 225, 0.055);
  --danger: #F97066; --danger-soft: #2A1614; --mark: #5C4A12;
  --agent-claude: #FB923C; --agent-codex: #2DD4BF; --agent-pi: #A78BFA;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }
html, body { overflow-x: clip; }
body {
  font-family: var(--sans); font-size: var(--text-base); line-height: 1.5;
  color: var(--ink); background: var(--ground);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
input, button, select { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

.header {
  position: sticky; top: 0; z-index: 10;
  padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--border);
}
.main { padding: 12px 16px 32px; }
.header > *, .main { max-width: 980px; margin-inline: auto; }

.topline { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.topline h1 { font-size: var(--text-lg); font-weight: 650; letter-spacing: -0.01em; }
.back { color: var(--dim); text-decoration: none; font-family: var(--mono); font-size: var(--text-sm); }
.back:hover { color: var(--accent); }
.spacer { flex: 1; }
.count { color: var(--dim); font-family: var(--mono); font-size: var(--text-xs); }

.search-field {
  display: flex; align-items: center; gap: 8px; background: var(--input-bg);
  border-radius: 12px; padding: 10px 14px; cursor: text;
}
.search-field:focus-within { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.prompt { font-family: var(--mono); font-weight: 600; color: var(--accent); }
#q { flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font-family: var(--mono); font-weight: 500; }
#q::placeholder { color: var(--faint); font-weight: 400; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.seg { display: inline-flex; background: var(--input-bg); border-radius: 10px; padding: 2px; }
.seg button {
  border: none; background: none; padding: 4px 10px; border-radius: 8px; cursor: pointer;
  font-size: var(--text-sm); color: var(--dim);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.seg button .n { font-family: var(--mono); font-size: var(--text-xs); color: var(--faint); margin-left: 4px; }
select {
  background: var(--input-bg); border: none; border-radius: 10px; padding: 5px 10px;
  font-size: var(--text-sm); max-width: 100%;
}
.check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--dim); cursor: pointer; }

/* list */
.cards { list-style: none; padding: 0; display: grid; gap: 8px; }
.card {
  display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; cursor: pointer;
}
.card:hover { border-color: var(--faint); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-title { font-weight: 600; overflow-wrap: anywhere; }
.card-prompt { color: var(--dim); font-size: var(--text-sm); margin-top: 4px; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-snippet { font-family: var(--mono); font-size: var(--text-xs); margin-top: 6px; color: var(--ink);
  background: var(--input-bg); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; color: var(--dim);
  font-family: var(--mono); font-size: var(--text-xs); min-width: 0; }
.meta .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: min(48ch, 100%); direction: rtl; text-align: left; }

.agent { font-family: var(--mono); font-size: var(--text-xs); font-weight: 600; text-transform: lowercase;
  padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.agent.claude { color: var(--agent-claude); }
.agent.codex { color: var(--agent-codex); }
.agent.pi { color: var(--agent-pi); }
.model { font-family: var(--mono); font-size: var(--text-xs); background: var(--input-bg); color: var(--ink);
  padding: 1px 7px; border-radius: 6px; overflow-wrap: anywhere; }
.tag { font-family: var(--mono); font-size: var(--text-xs); padding: 1px 7px; border-radius: 6px; }
.tag.gone { background: var(--danger-soft); color: var(--danger); }
.tag.sub { background: var(--accent-soft); color: var(--accent); }
.tag.mem { background: var(--input-bg); color: var(--ink); }
.tag.machine { border: 1px solid var(--faint); color: var(--dim); }
.secret { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 0.85em; background: var(--danger-soft); color: var(--danger); border: none; border-radius: 6px; padding: 0 6px; cursor: pointer; white-space: nowrap; }
.secret:hover { outline: 1px solid var(--danger); }
.secret.shown { background: var(--input-bg); color: var(--ink); white-space: pre-wrap; cursor: default; }
.secret.shown .hide { cursor: pointer; color: var(--dim); }
.secret.unavailable { cursor: default; opacity: 0.8; }

.pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; }
.btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px;
  cursor: pointer; font-size: var(--text-sm);
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.notice { text-align: center; color: var(--dim); padding: 48px 16px; }
.notice code { font-family: var(--mono); background: var(--input-bg); padding: 1px 6px; border-radius: 6px; }

/* session */
.session-head { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.session-head h2 { font-size: var(--text-lg); font-weight: 650; overflow-wrap: anywhere; }
.models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.models .label { color: var(--dim); font-size: var(--text-xs); font-family: var(--mono); }
.view-toggle { margin-top: 12px; }

.events { display: grid; gap: 8px; margin-top: 12px; }
.ev { border-radius: 12px; padding: 10px 12px; border: 1px solid var(--border); background: var(--surface);
  scroll-margin-top: 180px; min-width: 0; }
.ev.target { box-shadow: 0 0 0 2px var(--accent); }
.ev-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--dim);
  font-family: var(--mono); font-size: var(--text-xs); }
.ev-head .who { font-weight: 600; color: var(--ink); }
.ev-body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
.ev.user { background: var(--accent-soft); border-color: transparent; }
.ev.system { background: transparent; border-style: dashed; color: var(--dim); font-size: var(--text-sm); }
.ev details > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px;
  align-items: center; font-family: var(--mono); font-size: var(--text-xs); color: var(--dim); }
.ev details > summary::-webkit-details-marker { display: none; }
.ev details > summary::before { content: "▸"; color: var(--faint); }
.ev details[open] > summary::before { content: "▾"; }
.ev details .preview { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%; flex: 1 1 200px; min-width: 0; }
.ev pre, .raw pre { font-family: var(--mono); font-size: var(--text-xs); white-space: pre-wrap;
  overflow-wrap: anywhere; margin-top: 6px; background: var(--input-bg); border-radius: 8px; padding: 8px; }
.ev.tool_call, .ev.tool_result, .ev.thinking { background: transparent; }
.ev.error { border-color: var(--danger); }
.ev.error .who { color: var(--danger); }
.raw { margin-top: 12px; display: grid; gap: 4px; }
.raw .line { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; align-items: start; }
.raw .ln { font-family: var(--mono); font-size: var(--text-xs); color: var(--faint); text-align: right; padding-top: 14px; }
.load { display: flex; justify-content: center; margin: 10px 0; }

@media (max-width: 560px) {
  .raw .line { grid-template-columns: 1fr; }
  .raw .ln { text-align: left; padding-top: 0; }
}
</style>
</head>
<body>
<header class="header">
  <div class="topline">
    <h1>agentd</h1>
    <span class="count" id="machine"></span>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
  </div>
  <form id="form" action="javascript:void(0)">
    <label class="search-field">
      <span class="prompt" aria-hidden="true">◆</span>
      <input type="search" id="q" placeholder="search every transcript, tool output included" autocomplete="off"
        autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search transcripts">
    </label>
  </form>
  <div class="filters" id="filters">
    <div class="seg" id="agents" role="group" aria-label="Agent"></div>
    <select id="model" aria-label="Model"><option value="">all models</option></select>
    <select id="mac" aria-label="Mac" hidden><option value="">all Macs</option></select>
    <label class="check"><input type="checkbox" id="subagents"> subagents</label>
    <label class="check"><input type="checkbox" id="deleted"> deleted by the agent</label>
  </div>
</header>

<main class="main" id="main"></main>


<script>
// Hash-routed so back/forward and reloads keep your place:
//   #q=…&kind=…&model=…&mac=…&page=…&sub=1&del=1      the list
//   #m=<machine>&k=<kind>&p=<rel path>&i=<event>&q=…  one file (q highlights)
const $ = (id) => document.getElementById(id);
const main = $("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KINDS = ["claude", "codex", "pi", "memory"];
const PAGE_EVENTS = 200;
let thisMachine = "";

function route() { return new URLSearchParams(location.hash.slice(1)); }
function go(params) {
  location.hash = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== "" && v != null && v !== false)).toString();
}

async function api(path, params, init) {
  const res = await fetch(`/api/${path}?${new URLSearchParams(params)}`, init);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function when(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function span(a, b) {
  if (!a || !b) return "";
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
function project(cwd) { return cwd ? cwd.replace(/^\/Users\/[^/]+/, "~") : ""; }
function snippetHtml(s) { return esc(s).replace(/\x01/g, "<mark>").replace(/\x02/g, "</mark>"); }

// Escaped text → HTML with redaction markers as reveal buttons and the
// query's words marked (only outside tags).
function richText(text, q) {
  let html = esc(text).replace(/\[REDACTED:([a-z-]+)(?::([0-9a-f]{12}))?\]/g, (m, kind, id) =>
    id
      ? `<button type="button" class="secret" data-id="${id}" data-kind="${kind}" title="Redacted ${kind}: reveal from this Mac's vault">${kind} · reveal</button>`
      : `<span class="secret unavailable" title="Redacted ${kind}">${kind}</span>`);
  const words = (q || "").match(/[\p{L}\p{N}]{2,}/gu);
  if (!words) return html;
  const re = new RegExp(`(${words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "giu");
  return html.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, txt) => tag ?? txt.replace(re, "<mark>$1</mark>"));
}

// Reveal: POST with a custom header (the server refuses reveals without it,
// so another site can't trigger one), shown inline, hidden again after 30s.
main.addEventListener("click", async (e) => {
  const hide = e.target.closest(".secret.shown .hide");
  if (hide) { conceal(hide.closest(".secret")); return; }
  const b = e.target.closest("button.secret:not(.shown)");
  if (!b) return;
  e.preventDefault();
  try {
    const r = await api("reveal", { id: b.dataset.id }, { method: "POST", headers: { "X-Agentd-Reveal": "1" } });
    b.classList.add("shown");
    b.innerHTML = `${esc(r.value)} <span class="hide" role="button" tabindex="0">hide</span>`;
    b.timer = setTimeout(() => conceal(b), 30000);
  } catch (err) {
    b.classList.add("unavailable");
    b.title = err.message;
    b.textContent = `${b.dataset.kind} · not in this Mac's vault`;
  }
});
function conceal(b) {
  clearTimeout(b.timer);
  b.classList.remove("shown");
  b.textContent = `${b.dataset.kind} · reveal`;
}

function badge(kind) { const k = kind.replace(/-memory$/, ""); return `<span class="agent ${esc(k)}">${esc(k)}</span>`; }
function models(ms) { return ms.map((m) => `<span class="model">${esc(m)}</span>`).join(" "); }
function tags(s) {
  return (s.shape === "subagent" ? `<span class="tag sub">subagent</span>` : "") +
    (s.shape === "memory" ? `<span class="tag mem">memory</span>` : "") +
    (s.this_machine ? "" : `<span class="tag machine" title="Recorded on another Mac, synced here">from ${esc(s.machine)}</span>`) +
    (s.this_machine && !s.on_disk ? `<span class="tag gone" title="The agent deleted its file; this copy is from the archive">deleted · archived</span>` : "");
}

// ── list ──────────────────────────────────────────────────────────────

async function showList(r) {
  const q = r.get("q") || "", kind = r.get("kind") || "", model = r.get("model") || "", mac = r.get("mac") || "";
  const page = parseInt(r.get("page") || "1", 10), sub = r.get("sub") === "1", del = r.get("del") === "1";
  $("q").value = q; $("subagents").checked = sub; $("deleted").checked = del;
  $("filters").hidden = false;
  main.innerHTML = `<p class="notice">loading…</p>`;
  let data;
  try {
    data = await api("sessions", { q, kind, model, machine: mac, page, subagents: sub ? 1 : 0, deleted: del ? 1 : 0, limit: 40 });
  } catch (e) {
    $("count").textContent = "";
    main.innerHTML = `<p class="notice">${esc(e.message).replace(/`([^`]+)`/g, "<code>$1</code>")}</p>`;
    return;
  }
  thisMachine = data.machine;
  $("machine").textContent = `on ${data.machine}`;
  const total = Object.values(data.facets.kinds).reduce((a, b) => a + b, 0);
  $("agents").innerHTML = [["", "all", total], ...KINDS.map((k) => [k, k, data.facets.kinds[k] ?? 0])]
    .map(([v, label, n]) => `<button type="button" data-kind="${v}" aria-pressed="${kind === v}">${label}<span class="n">${n}</span></button>`).join("");
  const ms = Object.entries(data.facets.models).sort((a, b) => b[1] - a[1]);
  if (model && !data.facets.models[model]) ms.unshift([model, 0]);
  $("model").innerHTML = `<option value="">all models</option>` +
    ms.map(([m, n]) => `<option value="${esc(m)}"${m === model ? " selected" : ""}>${esc(m)} (${n})</option>`).join("");
  const macs = Object.entries(data.facets.machines);
  $("mac").hidden = macs.length < 2 && !mac;
  $("mac").innerHTML = `<option value="">all Macs</option>` +
    macs.map(([m, n]) => `<option value="${esc(m)}"${m === mac ? " selected" : ""}>${esc(m)}${m === data.machine ? " (this Mac)" : ""} (${n})</option>`).join("");
  $("count").textContent = `${data.total} ${q ? "matching " : ""}${sub ? "files" : "sessions"}`;

  if (!data.sessions.length) {
    main.innerHTML = `<p class="notice">${q ? "Nothing archived mentions that." : "Nothing here with these filters."}</p>`;
    return;
  }
  main.innerHTML = `<ol class="cards">${data.sessions.map((s) => {
    const href = "#" + new URLSearchParams({ m: s.machine, k: s.kind, p: s.rel_path, ...(s.hit_idx != null ? { i: s.hit_idx } : {}), ...(q ? { q } : {}) });
    return `<li><a class="card" href="${esc(href)}">
      <div class="card-top">${badge(s.kind)} <span class="card-title">${esc(s.title)}</span>${tags(s)}</div>
      ${s.first_prompt ? `<div class="card-prompt">${esc(s.first_prompt)}</div>` : ""}
      ${s.snippet ? `<div class="card-snippet">${snippetHtml(s.snippet)}</div>` : ""}
      <div class="meta">${models(s.models)}<span class="path" title="${esc(s.cwd)}">${esc(project(s.cwd))}</span>
        ${s.started_at ? `<span title="${esc(s.started_at)} → ${esc(s.ended_at)}">${esc(when(s.started_at))}${span(s.started_at, s.ended_at) ? ` · ${span(s.started_at, s.ended_at)}` : ""}</span>` : ""}
        ${s.shape === "memory" ? `<span>updated ${esc(when(s.updated_at))}</span>` : `<span>${s.messages} msgs · ${s.tool_calls} tools</span>`}${s.hits ? `<span>${s.hits} hit${s.hits === 1 ? "" : "s"}</span>` : ""}</div>
    </a></li>`;
  }).join("")}</ol>
  <nav class="pager" aria-label="Pages">
    <button class="btn" id="prev" ${page <= 1 ? "disabled" : ""}>← newer</button>
    <span class="count">page ${page} of ${Math.max(data.pages, 1)}</span>
    <button class="btn" id="next" ${page >= data.pages ? "disabled" : ""}>older →</button>
  </nav>`;
  const keep = { q, kind, model, mac, sub: sub ? 1 : "", del: del ? 1 : "" };
  $("prev").onclick = () => go({ ...keep, page: page - 1 });
  $("next").onclick = () => go({ ...keep, page: page + 1 });
  window.scrollTo(0, 0);
}

function listState() {
  const r = route();
  return { q: $("q").value.trim(), kind: r.has("m") ? "" : (r.get("kind") || ""), model: $("model").value, mac: $("mac").value,
    sub: $("subagents").checked ? 1 : "", del: $("deleted").checked ? 1 : "" };
}
$("form").onsubmit = () => go(listState());
$("agents").onclick = (e) => {
  const b = e.target.closest("button[data-kind]");
  if (b) go({ ...listState(), kind: b.dataset.kind });
};
for (const id of ["model", "mac", "subagents", "deleted"]) $(id).onchange = () => go(listState());

// ── one file ──────────────────────────────────────────────────────────

const ROLE = { user: "you", assistant: "assistant", thinking: "thinking", tool_call: "tool call", tool_result: "tool result", system: "system", memory: "memory" };

function eventHtml(e, q, target) {
  const cls = `ev ${e.role}${e.error ? " error" : ""}${target ? " target" : ""}`;
  const head = `<span class="who">${ROLE[e.role] ?? esc(e.role)}${e.name ? ` · ${esc(e.name)}` : ""}</span>` +
    (e.model ? `<span class="model">${esc(e.model)}</span>` : "") +
    (e.ts ? `<span title="JSONL line ${e.seq}">${esc(when(e.ts))}</span>` : "");
  const body = richText(e.text, q);
  if (e.role === "tool_call" || e.role === "tool_result" || e.role === "thinking") {
    const first = e.text.split("\n").find((l) => l.trim() && !/^[{}\[\]]$/.test(l.trim()) && !/:\s*null,?$/.test(l)) ?? "";
    return `<article class="${cls}" id="ev-${e.idx}"><details${target ? " open" : ""}>
      <summary>${head}<span class="preview">${esc(first.trim().slice(0, 200))}</span><span>${e.text.length.toLocaleString()} chars</span></summary>
      <pre>${body}</pre></details></article>`;
  }
  return `<article class="${cls}" id="ev-${e.idx}"><div class="ev-head">${head}</div><div class="ev-body">${body}</div></article>`;
}

async function showSession(r) {
  const machine = r.get("m"), kind = r.get("k"), path = r.get("p"), q = r.get("q") || "";
  const target = r.has("i") ? parseInt(r.get("i"), 10) : null;
  const raw = r.get("raw") === "1";
  $("filters").hidden = true;
  $("q").value = q;
  main.innerHTML = `<p class="notice">loading…</p>`;
  const start = target != null ? Math.max(target - 40, 0) : 0;
  let data;
  try {
    data = await api("session", { machine, kind, path, offset: start, limit: PAGE_EVENTS });
  } catch (e) {
    main.innerHTML = `<p class="notice">${esc(e.message)}</p>`;
    return;
  }
  const s = data.session;
  $("count").textContent = `${s.events.toLocaleString()} events`;
  const back = sessionStorage.getItem("agentd-list") || "";
  main.innerHTML = `
    <section class="session-head">
      <a class="back" href="#${esc(back)}">← all</a>
      <div class="card-top" style="margin-top:8px">${badge(s.kind)} <h2>${esc(s.title)}</h2>${tags(s)}</div>
      ${s.shape === "memory" ? "" : `<div class="models"><span class="label">written by</span> ${models(s.models) || `<span class="label">no model recorded</span>`}</div>`}
      <div class="meta"><span class="path" title="${esc(s.cwd)}">${esc(project(s.cwd))}</span>
        ${s.started_at ? `<span>${esc(when(s.started_at))} → ${esc(when(s.ended_at))}</span>` : ""}
        ${s.shape === "memory" ? "" : `<span>${s.messages} msgs · ${s.tool_calls} tool calls</span>`}
        <span title="${esc(s.rel_path)}">${esc(s.session_id || s.rel_path.split("/").pop())}</span><span>${esc(s.machine)}</span></div>
      <div class="seg view-toggle" role="group" aria-label="View">
        <button type="button" id="v-events" aria-pressed="${!raw}">${s.shape === "memory" ? "note" : "conversation"}</button>
        <button type="button" id="v-raw" aria-pressed="${raw}">raw</button>
      </div>
    </section>
    <div id="body"></div>`;
  const keep = { m: machine, k: kind, p: path, q, ...(target != null ? { i: target } : {}) };
  $("v-events").onclick = () => go(keep);
  $("v-raw").onclick = () => go({ ...keep, raw: 1 });
  if (raw) return showRaw(machine, kind, path, q);

  const body = $("body");
  let lo = data.offset, hi = data.offset + data.events.length;
  body.innerHTML = `<div class="load" id="earlier-wrap"></div>
    <div class="events" id="events">${data.events.map((e) => eventHtml(e, q, e.idx === target)).join("")}</div>
    <div class="load" id="later-wrap"></div>`;
  const events = $("events");
  const later = () => {
    $("later-wrap").innerHTML = hi < s.events ? `<button class="btn" id="later">↓ ${s.events - hi} more events</button>` : "";
    if (hi < s.events) $("later").onclick = async () => {
      const more = await api("session", { machine, kind, path, offset: hi, limit: PAGE_EVENTS });
      events.insertAdjacentHTML("beforeend", more.events.map((e) => eventHtml(e, q, false)).join(""));
      hi += more.events.length;
      later();
    };
  };
  const earlier = () => {
    $("earlier-wrap").innerHTML = lo > 0 ? `<button class="btn" id="earlier">↑ ${lo} earlier events</button>` : "";
    if (lo > 0) $("earlier").onclick = async () => {
      const from = Math.max(lo - PAGE_EVENTS, 0);
      const more = await api("session", { machine, kind, path, offset: from, limit: lo - from });
      const anchor = events.firstElementChild;
      const before = anchor?.getBoundingClientRect().top ?? 0;
      events.insertAdjacentHTML("afterbegin", more.events.map((e) => eventHtml(e, q, false)).join(""));
      window.scrollBy(0, (anchor?.getBoundingClientRect().top ?? 0) - before);
      lo = from;
      earlier();
    };
  };
  earlier();
  later();
  if (target != null) document.getElementById(`ev-${target}`)?.scrollIntoView({ block: "start" });
  else window.scrollTo(0, 0);
}

async function showRaw(machine, kind, path, q) {
  const body = $("body");
  let offset = 0;
  body.innerHTML = `<div class="raw" id="raw"></div><div class="load" id="raw-more"></div>`;
  const more = async () => {
    const data = await api("raw", { machine, kind, path, offset, limit: 200 });
    $("raw").insertAdjacentHTML("beforeend", data.lines.map((l) =>
      `<div class="line"><span class="ln">${l.seq}</span><pre>${richText(l.text, q)}</pre></div>`).join(""));
    offset += data.lines.length;
    $("raw-more").innerHTML = offset < data.total ? `<button class="btn" id="raw-next">↓ ${data.total - offset} more lines</button>` : "";
    if (offset < data.total) $("raw-next").onclick = more;
  };
  try { await more(); } catch (e) { body.innerHTML = `<p class="notice">${esc(e.message)}</p>`; }
}

function render() {
  const r = route();
  if (r.has("m") && r.has("k") && r.has("p")) return showSession(r);
  sessionStorage.setItem("agentd-list", location.hash.slice(1));
  return showList(r);
}
window.addEventListener("hashchange", render);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
render();
</script>
</body>
</html>
